apiVersion: v1
kind: Service
metadata:
  name: mcast-relay
spec:
  selector:
    app.kubernetes.io/name: mcast-relay
  ports:
    - name: feed
      port: 5000
      targetPort: 5000
      protocol: UDP
    - name: discovery
      port: 5001
      targetPort: 5001
      protocol: UDP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
