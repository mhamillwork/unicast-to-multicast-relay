apiVersion: v1
kind: ConfigMap
metadata:
  name: mcast-relay
data:
  config.yaml: |
    egress_interface: eth1
    metrics_listen: 0.0.0.0:9100
    log_level: info
    streams:
      - name: market-feed-a
        listen: 0.0.0.0:5000
        group: 239.1.1.10
        port: 5000
        ttl: 4
        allowed_sources: ["10.0.0.0/8"]
      - name: discovery
        listen: 0.0.0.0:5001
        group: 239.255.255.250
        port: 1900
        ttl: 1
