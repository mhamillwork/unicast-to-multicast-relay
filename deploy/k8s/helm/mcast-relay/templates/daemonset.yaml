apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mcast-relay.fullname" . }}
  labels:
    {{- include "mcast-relay.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mcast-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcast-relay.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config.yaml | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mcast-relay.fullname" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcast-relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/mcast-relay/config.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9100
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcast-relay
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "mcast-relay.fullname" . }}
