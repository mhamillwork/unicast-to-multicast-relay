# Socket buffers large enough for 100k+ small datagrams per second.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 5000
# Reverse-path filtering drops multicast and asymmetric gateway traffic.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
# Required only when pimd routes multicast through this host.
# net.ipv4.conf.all.mc_forwarding = 1
