name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Loopback multicast
        run: sudo ip link set lo multicast on
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Race detector
        run: go test -race ./internal/... ./cmd/...
      - name: Network namespace integration
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
          sudo -E make integration
      - name: Load test
        run: |
          sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216
          make loadtest-nfr

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Install kind and helm
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Cilium kind test
        run: test/kind/run.sh
